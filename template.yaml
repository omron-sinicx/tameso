teaser: teaser.png
overview: |
  Tactile memory, the ability to store and retrieve touch-based experience, is critical for contact-rich tasks such as key insertion under uncertainty.
  To replicate this capability, we introduce **Tactile Memory with Soft Robot (TaMeSo-bot)**, a system that integrates a soft wrist with tactile retrieval-based control to enable safe and robust manipulation.
  The soft wrist allows safe contact exploration during data collection, while tactile memory reuses past demonstrations via retrieval for flexible adaptation to unseen scenarios.
  The core of this system is the **Masked Tactile Trajectory Transformer (MAT<sup>3</sup>)**, which jointly models spatiotemporal interactions between robot actions, distributed tactile feedback, force-torque measurements, and proprioceptive signals.
  Through masked-token prediction, MAT<sup>3</sup> learns rich spatiotemporal representations by inferring missing sensory information from context, autonomously extracting task-relevant features without explicit subtask segmentation.
  We validate our approach on peg-in-hole tasks with diverse pegs and conditions in real-robot experiments.
  Our extensive evaluation demonstrates that MAT<sup>3</sup> achieves higher success rates than the baselines over all conditions and shows remarkable capability to adapt to unseen pegs and conditions.

body:
  - title: Method
    text: |
      <img src="method.png" class="uk-align-center uk-responsive-width" alt="" />
      <span class="uk-text-meta">Figure 1: Masked Tactile Trajectory Transformer (MAT<sup>3</sup>) for distributed taxels. During training, the encoder learns to reconstruct the states and actions within a time window <i>H</i>, while randomly masking input tokens. After training, the tactile trajectory datasets are encoded into a single representative embedding <b>z</b> that captures the spatio-temporal dynamics of the tactile-action sequences.</span>

      **Softness for safe data collection.** TaMeSo-bot pairs a rigid arm with a highly deformable soft wrist and a two-finger gripper carrying a 3 x 3 array of taxels, each measuring a 3D force. The compliance pays off twice: it absorbs contact forces so teleoperated demonstrations can be collected without triggering protective stops, and it keeps the same contact-rich behavior safe at execution time. Those offline demonstrations become the **tactile memory**, a database the robot queries instead of rolling out a learned policy.

      **MAT<sup>3</sup> encodes what the fingers felt.** The keys of that database come from a bidirectional Transformer over sub-trajectories of taxel readings and actions. Taxels and the action are the base tokens, while force-torque, arm pose, and gripper pose are fused in as auxiliary global context; sinusoidal encodings place each taxel on the sensor grid and the action token at its centre. Training is masked-token reconstruction: a random fraction of the input is hidden and the encoder infers it from the surrounding spatial and temporal context, so task-relevant structure emerges without any subtask labels.

      **Retrieval is the policy.** At execution time the current action token is masked, the encoder and average pooling produce a query embedding, and the $k$ nearest stored embeddings are found by L2 distance over an HNSW index, fast enough for real-time control. One neighbour is sampled and its action is executed, so the database itself acts as a non-parametric policy whose behavior stays bounded by the demonstration data.
  - title: Results
    text: |
      Demonstrations were collected on two peg shapes only, and the policy is then asked to insert five shapes it has never touched. MAT<sup>3</sup> matches the masking-free variant on the seen pegs and pulls clearly ahead on the unseen ones: **85% versus 71%** over 200 trials, while the tactile Transformer baseline stays below 20%.

      #### Real-robot evaluation on seen and unseen pegs
      <img src="method2.png" class="uk-align-center uk-responsive-width" style="width:80%" alt="" />
      <span class="uk-text-meta">Figure 2: Seen and unseen pegs, with dimensions in mm.</span>
      <p class="uk-text-meta">Peg-in-hole task success rate (%) under four different starting positions.</p>
      <div class="uk-overflow-auto">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr>
              <th></th>
              <th colspan="2" class="uk-text-center"><b>Seen</b></th>
              <th colspan="5" class="uk-text-center"><b>Unseen</b></th>
              <th colspan="2" class="uk-text-center"><b>Total</b></th>
            </tr>
            <tr>
              <th><b>Method</b></th>
              <th>Square</th><th>Cyl. (&#8960;40)</th>
              <th>Cyl. (&#8960;30)</th><th>Rectangle</th><th>Oval</th><th>Hexagon</th><th>Pentagon</th>
              <th>Seen</th><th>Unseen</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Tactile Transformer</td>
              <td>8/40</td><td>10/40</td>
              <td>12/40</td><td>6/40</td><td>7/40</td><td>5/40</td><td>5/40</td>
              <td>18/80 (22.5%)</td><td>35/200 (17.5%)</td>
            </tr>
            <tr>
              <td>MAT<sup>3</sup> w/o Mask</td>
              <td><b>36/40</b></td><td><b>36/40</b></td>
              <td>33/40</td><td>26/40</td><td>28/40</td><td>30/40</td><td>25/40</td>
              <td><b>72/80 (90%)</b></td><td>142/200 (71%)</td>
            </tr>
            <tr class="uk-active">
              <td><b>MAT<sup>3</sup> (Ours)</b></td>
              <td>35/40</td><td><b>36/40</b></td>
              <td><b>35/40</b></td><td><b>32/40</b></td><td><b>34/40</b></td><td><b>36/40</b></td><td><b>33/40</b></td>
              <td>71/80 (88.8%)</td><td><b>170/200 (85%)</b></td>
            </tr>
          </tbody>
        </table>
      </div>

      The gap widens once the setup itself changes. Under starting positions outside the demonstration range, added friction between peg and fixture, and a tilted grasp, MAT<sup>3</sup> succeeds on **57.5%** of trials against 29.2% for the unmasked variant, evidence that masked training buys robustness rather than just accuracy.

      #### Real-robot evaluation under unseen conditions
      <p class="uk-text-meta">Different starting positions, increased friction between the peg and the fixture surface, and a tilted grasping pose.</p>
      <div class="uk-overflow-auto">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr>
              <th><b>Method</b></th>
              <th>Unseen Starting Positions</th>
              <th>Increased Friction</th>
              <th>5&deg; Tilted Grasp</th>
              <th><b>Total</b></th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Tactile Transformer</td><td>2/40</td><td>2/40</td><td>5/40</td><td>9/120 (7.5%)</td></tr>
            <tr><td>MAT<sup>3</sup> w/o Mask</td><td>9/40</td><td>7/40</td><td>19/40</td><td>35/120 (29.2%)</td></tr>
            <tr class="uk-active">
              <td><b>MAT<sup>3</sup> (Ours)</b></td>
              <td><b>20/40</b></td><td><b>20/40</b></td><td><b>29/40</b></td><td><b>69/120 (57.5%)</b></td>
            </tr>
          </tbody>
        </table>
      </div>
