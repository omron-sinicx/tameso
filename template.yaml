projects:
  - title: 'PHASE: Compliance-Enabled Tactile Phase Retrieval for Few-Shot Insertion Learning'
    journal: "IROS'26"
    img: https://omron-sinicx.github.io/phase/teaser.png
    description: |
      A compliant wrist reveals insertion phases from touch, so phase-consistent retrieval lifts few-shot peg-in-hole success by 13 points.
    url: https://omron-sinicx.github.io/phase/
  - title: 'Multi-Agent Behavior Retrieval: Retrieval-Augmented Policy Training for Cooperative Manipulation by Mobile Robots'
    journal: "IROS'24"
    img: https://omron-sinicx.github.io/mabr/assets/teaser.png
    description: |
      A multi-agent coordination skill database lets multiple mobile robots reuse past memories to adapt to new cooperative manipulation tasks.
    url: https://omron-sinicx.github.io/mabr/
