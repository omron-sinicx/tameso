      Retrieval is what keeps the policy inside the demonstration distribution. A parametric policy has no such guarantee, and ACT extrapolates beyond it, executing insertion-phase behavior before the alignment is done.

      The gap widens once the setup itself changes. Under starting positions outside the demonstration range, added friction between peg and fixture, and a tilted grasp, MAT<sup>3</sup> succeeds on **57.5%** of trials, while MAT<sup>3</sup> w/o Mask drops to 29.2%, ACT to 14.2%, and the tactile Transformer to 7.5%, evidence that masked training buys robustness rather than just accuracy.

      #### Real-robot evaluation under unseen conditions
      <p class="uk-text-meta">Different starting positions, increased friction between the peg and the fixture surface, and a tilted grasping pose.</p>
